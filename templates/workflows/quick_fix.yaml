name: "quick_fix"
description: "Quick code fixes, typos, documentation updates (≤3 files, <100 lines)"
version: "1.0.1"
author: "arkadian-system"
created: "2025-10-25"
last_modified: "2025-11-01"

applies_to:
  primary_intent: "develop"
  sub_intent: ["quick_fix"]
  complexity: ["simple"]
  urgency: ["low", "normal", "high", "critical"]
  multi_project: false

execution:
  agents: ["ark-developer"]
  phases:
    - id: "fix"
      name: "Apply Quick Fix"
      agent: "ark-developer"
      depends_on: null
      approval_required: false
      actions:
        - "Create branch: fix/<area>-<slug>"
        - "Apply code/documentation fix (≤3 files, <100 lines)"
        - "Use ark-ops skill for manual verification"
        - "Run unit tests directly (internal validation loop)"
        - "Commit with conventional commit message"
      checkpoint:
        path: "git commit SHA"
        required_for_next_phase: false
      timeout_seconds: 600
      auto_retry: true
      max_retries: 3
      # Orchestrator:
      # - bind to exactly 1 selected project (plus depends_on)
      # - docs: take default_sections_by_intent.dev from that project's INDEX.md
      # - inject scripts_hint from project INDEX.md (make test, make integrationtest)
      # NOTE: ark-developer handles testing internally via ark-ops skill

success_criteria:
  - "Fix applied to ≤3 files"
  - "Code changes <100 lines"
  - "All tests pass"
  - "No test regressions"

performance:
  estimated_duration_seconds: 300
  max_duration_seconds: 600

recovery:
  on_phase_failure: "retry_phase"
  checkpoint_frequency: "per_phase"
  resume_from: "last_checkpoint"
