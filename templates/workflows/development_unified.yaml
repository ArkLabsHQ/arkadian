name: "development_unified"
description: |
  Unified development workflow with fixed pipeline: explore→plan→implement→review.
  All phases ALWAYS execute - no conditional skipping based on complexity.

  MANDATORY PIPELINE: Each phase receives artifacts from ALL prior phases.
  Hooks enforce prerequisites — agents cannot be invoked without upstream artifacts.

version: "5.0.0"
author: "arkadian-system"
created: "2025-12-15"
last_modified: "2026-02-11"

# This workflow enforces a consistent pipeline for all development tasks.
# No conditional skipping - all phases always execute.

applies_to:
  primary_intent: "develop"
  sub_intent: ["quick_fix", "small_feature", "medium_feature", "large_feature", "refactor"]
  complexity: ["any"]  # All complexities follow the same pipeline
  urgency: ["low", "normal", "high", "critical"]
  multi_project: true  # Can handle cross-project work

# Workflow configuration (can be overridden at approval time)
config:
  require_test_verification: true
  allow_manual_testing_fallback: true

# Pipeline artifact chain (hook-enforced)
# Each phase MUST receive artifacts from ALL prior phases.
# Pre-agent hook BLOCKS if prerequisites are missing.
# Post-agent hook FAILS if expected outputs are missing.
pipeline:
  artifact_chain:
    explore:
      receives: []
      produces:
        - "artifacts/explore/assessment.yaml"
        - "artifacts/explore/response.md"
    plan:
      receives:
        - from: "explore"
          artifacts: ["artifacts/explore/assessment.yaml"]
      produces:
        - "specs/{project_id}/{feature_id}/spec.md"
        - "specs/{project_id}/{feature_id}/plan.md"
        - "specs/{project_id}/{feature_id}/tasks.md"
      note: "ALWAYS REQUIRED - no skip conditions"
    implement:
      receives:
        - from: "explore"
          artifacts: ["artifacts/explore/assessment.yaml"]
        - from: "plan"
          artifacts:
            - "specs/{project_id}/{feature_id}/spec.md"
            - "specs/{project_id}/{feature_id}/plan.md"
            - "specs/{project_id}/{feature_id}/tasks.md"
      produces:
        - "artifacts/implement/detailed_report.md"
        - "artifacts/implement/test-evidence.md"
        - "artifacts/implement/changes.yaml"
    review:
      receives:
        - from: "explore"
          artifacts: ["artifacts/explore/assessment.yaml"]
        - from: "plan"
          artifacts:
            - "specs/{project_id}/{feature_id}/spec.md"
            - "specs/{project_id}/{feature_id}/plan.md"
            - "specs/{project_id}/{feature_id}/tasks.md"
        - from: "implement"
          artifacts:
            - "artifacts/implement/detailed_report.md"
            - "artifacts/implement/test-evidence.md"
            - "artifacts/implement/changes.yaml"
      produces:
        - "artifacts/review/review_report.md"
        - "artifacts/review/_result.json"

execution:
  agents: ["ark-guru", "ark-project-manager", "ark-developer", "ark-pr-reviewer"]

  phases:
    # ═══════════════════════════════════════════════════════════════════
    # PHASE 1: EXPLORE (Always runs)
    # Hook enforcement: Post-agent FAILS if assessment.yaml missing (HG-PIPE-GURU-01)
    # ═══════════════════════════════════════════════════════════════════
    - id: "explore"
      name: "Explore & Understand Context"
      agent: "ark-guru"
      depends_on: null
      approval_required: false  # Auto-proceed after explore

      actions:
        - "Search prior sessions for related work (MANDATORY)"
        - "Read relevant codebase files to understand context"
        - "Verify stated scope by checking ≥3 related files"
        - "Challenge assumptions about scope and approach"
        - "Identify affected components, files, dependencies"
        - "Assess scope: number of files, type of changes needed"
        - "Determine if existing tests cover the change area"
        - "Check if infrastructure setup is needed for testing"
        - "Write assessment.yaml with full schema (HOOK ENFORCED)"

      # Artifacts received from prior phases
      artifacts_in: []  # First phase - no inputs

      # ark-guru MUST output this artifact (post-agent hook enforced)
      outputs:
        - path: "artifacts/explore/assessment.yaml"
          required: true
          hook_enforced: "HG-PIPE-GURU-01"
          schema: |
            confidence: 0.0-1.0
            rationale: "<exploration summary>"

            input_critical_analysis:
              scope_verified: true | false
              files_checked: [<list>]
              assumptions_challenged: [<list>]

            prior_work:
              sessions_found: <number>
              relevant_sessions: [<list>]

            affected_scope:
              files_estimated: <number>
              files_identified: [<list with paths, change_type, reason>]
              components: [<list>]
              cross_project: true | false

            codebase_analysis:
              key_functions: [<list with name, file, relevance>]
              test_coverage:
                existing_tests: [<test file paths>]
                coverage_adequate: true | false

            testing_recommendation:
              strategy: "existing_tests" | "unit_tests" | "integration_tests" | "infra_setup" | "manual"
              existing_tests_sufficient: true | false
              infra_required: true | false
              infra_complexity: "none" | "light" | "heavy"
              suggested_approach: "<description>"

            decisions_made:
              - question: "<what was ambiguous>"
                chosen: "<what was decided>"
                rationale: "<why>"

            risks:
              - "<potential issue 1>"
              - "<potential issue 2>"

        - path: "artifacts/explore/response.md"
          required: false

      checkpoint:
        path: "artifacts/explore/assessment.yaml"
        required_for_next_phase: true
      timeout_seconds: 600

    # ═══════════════════════════════════════════════════════════════════
    # PHASE 2: PLAN (Always runs - no skipping)
    # Hook enforcement:
    #   Pre-agent BLOCKS if assessment.yaml missing
    # ═══════════════════════════════════════════════════════════════════
    - id: "plan"
      name: "Create Implementation Plan"
      agent: "ark-project-manager"
      depends_on: "explore"

      approval_required: true
      approval_message: "Planning complete. Review spec and proceed to implementation?"

      actions:
        - "Read explore assessment (artifacts_in) and verify ≥2 claims"
        - "Create spec.md with requirements and acceptance criteria"
        - "Create plan.md with implementation approach and architecture decisions"
        - "Create tasks.md with dependency-ordered task breakdown"
        - "Use pm-spec, pm-plan, pm-tasks skills for consistent output"
        - "Define success criteria and acceptance tests"
        - "Identify test strategy based on explore recommendation"

      # Artifacts received from prior phases (MANDATORY)
      artifacts_in:
        - path: "artifacts/explore/assessment.yaml"
          from_step: "explore"
          description: "Guru exploration findings — complexity, affected files, risks"

      outputs:
        - path: "specs/{project-id}/{feature-id}/spec.md"
          required: true
        - path: "specs/{project-id}/{feature-id}/plan.md"
          required: true
        - path: "specs/{project-id}/{feature-id}/tasks.md"
          required: true
        - path: "specs/{project-id}/{feature-id}/_result.json"
          required: true
          schema: |
            status: "success | partial | failure"
            phase_completed: "plan"
            agent: "ark-project-manager"
            completed_at: "<ISO timestamp>"
            artifacts_produced: [
              { path: "spec.md", type: "spec" },
              { path: "plan.md", type: "plan" },
              { path: "tasks.md", type: "tasks" }
            ]
            summary: "<brief summary>"

      checkpoint:
        path: "specs/{project-id}/{feature-id}/_result.json"
        required_for_next_phase: true
      timeout_seconds: 900

    # ═══════════════════════════════════════════════════════════════════
    # PHASE 3: IMPLEMENT + TEST (Single phase — ark-developer owns both)
    # The developer implements code AND runs tests in the same session.
    # This avoids context loss from splitting into separate invocations.
    # Hook enforcement:
    #   Pre-agent BLOCKS if assessment.yaml missing
    #   Pre-agent BLOCKS if specs/ empty when planning was needed
    # ═══════════════════════════════════════════════════════════════════
    - id: "implement"
      name: "Implement & Test Changes"
      agent: "ark-developer"
      depends_on: "plan"  # Or "explore" if plan was skipped

      approval_required: true
      approval_message: "Ready to implement. Proceed?"

      actions:
        # Implementation
        - "Read ALL artifacts_in (assessment + spec + plan + tasks)"
        - "Verify ≥3 guru claims by reading referenced code"
        - "Verify ≥2 PM tasks are implementable"
        - "Document discrepancies in detailed_report.md"
        - "Create feature branch: feat/<area>-<slug> or fix/<area>-<slug>"
        - "Implement code changes following plan"
        - "Commit with conventional commit message"
        # Testing (same session — do NOT defer to a separate phase)
        - "Write unit tests for new/changed code"
        - "Run unit tests (make test / go test)"
        - "MANDATORY: Use the dev-loop skill specified in testing.skill with testing.mode"
        - "DO NOT write ad-hoc test procedures — follow the skill's Development & Test Iteration Loop"
        - "At each iteration: read BOTH test output AND service logs (mandatory per skill)"
        - "Document which dev-loop skill was followed and which mode was used in test-evidence.md"
        - "Fix any test failures before finishing"
        - "Write test-evidence.md with all commands, raw output, key log lines, and skill adherence"
        - "Output implementation report with test results"

      # Full artifact chain from ALL prior phases (MANDATORY)
      artifacts_in:
        - path: "artifacts/explore/assessment.yaml"
          from_step: "explore"
          description: "Guru exploration findings — complexity, affected files, risks, test strategy"
        - path: "specs/{feature-id}/spec.md"
          from_step: "plan"
          description: "Feature specification with user stories and requirements"
        - path: "specs/{feature-id}/plan.md"
          from_step: "plan"
          description: "Implementation plan with architecture decisions"
        - path: "specs/{feature-id}/tasks.md"
          from_step: "plan"
          description: "Dependency-ordered task breakdown"

      outputs:
        - path: "artifacts/implement/detailed_report.md"
          required: true
        - path: "artifacts/implement/test-evidence.md"
          required: true
          description: |
            Test commands, raw output, key log lines, and reproduction steps.
            MUST include:
            - Which dev-loop skill was followed (arkd-dev-loop, fulmine-dev-loop, etc.)
            - Steps executed from the skill (e.g., "Steps 0, 1, 2, 5, 7")
            - Wallet initialization status (for arkd: initialized/unlocked/funded)
            - Infrastructure setup commands and their output
            - Test execution commands with full output
            - Any deviations from the skill's documented procedure
        - path: "artifacts/implement/changes.yaml"
          required: true
          schema: |
            branch: "<branch name>"
            input_verification:
              guru_claims_verified: <count>
              pm_tasks_verified: <count>
              discrepancies: [<list>]
            commits:
              - sha: "<commit sha>"
                message: "<message>"
            files_changed:
              - path: "<file>"
                change_type: "added" | "modified" | "deleted"
                lines_added: <n>
                lines_removed: <n>
            tests_written:
              - path: "<test file>"
                test_names: [<test names>]
            tests_run:
              strategy_used: "<strategy type>"
              commands_executed:
                - command: "<cmd>"
                  exit_code: <n>
              tests_passed: <n>
              tests_failed: <n>
              manual_test_passed: true | false
              integration_test_written: true | false
              integration_test_name: "<test name>"
              status: "passed" | "failed" | "manual_pending"

      checkpoint:
        path: "artifacts/implement/changes.yaml"
        required_for_next_phase: true
      timeout_seconds: 2400  # 40min — covers implement + test
      auto_retry: true
      max_retries: 3

    # ═══════════════════════════════════════════════════════════════════
    # PHASE 4: REVIEW (Always runs after implementation)
    # Comprehensive code review of all changes made during implementation
    # ═══════════════════════════════════════════════════════════════════
    - id: "review"
      name: "Code Review & Quality Check"
      agent: "ark-pr-reviewer"
      depends_on: "implement"

      approval_required: true
      approval_message: "Implementation complete. Proceed with code review?"

      actions:
        - "Read ALL artifacts from previous phases (assessment, spec, plan, tasks, implementation report)"
        - "Review all code changes from the implementation"
        - "Check adherence to plan.md and tasks.md"
        - "Verify test coverage and test quality"
        - "Check for security issues, bugs, and edge cases"
        - "Validate conventional commit messages"
        - "Verify no regressions introduced"
        - "Create comprehensive review report with findings"
        - "Recommend approval, changes, or rejection"

      artifacts_in:
        - path: "artifacts/explore/assessment.yaml"
          from_step: "explore"
          description: "Original scope and requirements"
        - path: "specs/{feature-id}/spec.md"
          from_step: "plan"
          description: "Feature specification"
        - path: "specs/{feature-id}/plan.md"
          from_step: "plan"
          description: "Implementation plan"
        - path: "specs/{feature-id}/tasks.md"
          from_step: "plan"
          description: "Task breakdown"
        - path: "artifacts/implement/detailed_report.md"
          from_step: "implement"
          description: "Implementation details and decisions"
        - path: "artifacts/implement/test-evidence.md"
          from_step: "implement"
          description: "Test results and evidence"
        - path: "artifacts/implement/changes.yaml"
          from_step: "implement"
          description: "Changes summary"

      outputs:
        - path: "artifacts/review/review_report.md"
          required: true
          description: "Comprehensive code review with findings, recommendations, and approval decision"
        - path: "artifacts/review/_result.json"
          required: true
          schema: |
            status: "approved" | "needs_changes" | "rejected"
            phase_completed: "review"
            agent: "ark-pr-reviewer"
            completed_at: "<ISO timestamp>"
            findings:
              critical_issues: <count>
              major_issues: <count>
              minor_issues: <count>
              suggestions: <count>
            recommendation: "approve" | "request_changes" | "reject"
            summary: "<brief summary>"

      checkpoint:
        path: "artifacts/review/_result.json"
        required_for_next_phase: false  # This is the final phase
      timeout_seconds: 900

# Success criteria for the entire workflow
success_criteria:
  - "Explore phase completed with assessment.yaml (hook enforced)"
  - "Planning phase completed with spec.md, plan.md, tasks.md (always required)"
  - "Implementation verified ≥3 guru claims and ≥2 PM tasks"
  - "All automated tests pass OR manual verification complete"
  - "No regressions in existing tests"
  - "Code review completed with findings and recommendation"

# Workflow phase transitions
loop_control:
  entry_point: "explore"
  terminal_phase: "review"  # Last agent phase

  # Phase transitions (normal flow - all phases always execute)
  transitions:
    explore: "plan"
    plan: "implement"
    implement: "review"

# Performance estimates (all tasks follow same pipeline)
performance:
  estimated_seconds: 3600  # 60 minutes for full pipeline
  max_seconds: 7200  # 120 minutes maximum
  phase_breakdown:
    explore: 600  # 10 minutes
    plan: 900  # 15 minutes
    implement: 2400  # 40 minutes
    review: 900  # 15 minutes
