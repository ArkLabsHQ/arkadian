# Metadata
name: "quick_fix"
description: "Quick code fixes, typos, documentation updates (≤3 files, <100 lines)"
version: "1.0.0"
author: "arkadian-system"
created: "2025-10-25"
last_modified: "2025-10-25"

# Applicability
applies_to:
  primary_intent: "develop"
  sub_intent: ["quick_fix"]
  complexity: ["simple"]
  urgency: ["low", "normal", "high", "critical"]
  multi_project: false

# Execution
execution:
  agents: ["ark-developer", "ark-tester"]
  phases:
    - id: "fix"
      name: "Apply Quick Fix"
      agent: "developer"
      depends_on: null
      approval_required: false
      actions:
        - "Create branch: fix/<area>-<slug>"
        - "Apply code fix (≤3 files, <100 lines)"
        - "Run unit tests"
        - "Commit with conventional commit message"
      checkpoint:
        path: "git commit SHA"
        required_for_next_phase: true
      timeout_seconds: 300
      auto_retry: true
      max_retries: 1

    - id: "auto_test"
      name: "Auto-Validate Fix"
      agent: "tester"
      depends_on: "fix"
      approval_required: false
      actions:
        - "Run test suite (unit tests)"
        - "Validate no regressions"
        - "Check code coverage maintained"
      timeout_seconds: 300
      auto_retry: true
      max_retries: 2

# Success criteria
success_criteria:
  - "Fix applied to ≤3 files"
  - "Code changes <100 lines"
  - "All tests pass"
  - "No test regressions"

# Performance
performance:
  estimated_duration_seconds: 300
  max_duration_seconds: 600

# Recovery
recovery:
  on_phase_failure: "retry_phase"
  checkpoint_frequency: "per_phase"
  resume_from: "last_checkpoint"
