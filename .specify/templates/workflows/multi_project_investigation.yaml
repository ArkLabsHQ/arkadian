# Metadata
name: "multi_project_investigation"
description: "Parallel investigation across multiple projects with synthesis"
version: "1.0.0"
author: "arkadian-system"
created: "2025-10-25"
last_modified: "2025-10-25"

# Applicability
applies_to:
  primary_intent: "ask_question"
  complexity: ["simple", "medium", "complex"]
  urgency: ["low", "normal", "high", "critical"]
  multi_project: true

# Execution
execution:
  agents: ["ark-guru", "ark-project-manager"]
  phases:
    - id: "investigate_project_1"
      name: "Investigate Project 1"
      agent: "guru"
      depends_on: null
      approval_required: false
      actions:
        - "Load project 1 documentation"
        - "Search for relevant concepts"
        - "Extract findings and citations"
        - "Document project-specific insights"
      checkpoint:
        path: "project-1-findings.md"
        required_for_next_phase: true
      timeout_seconds: 300
      parallel_with: ["investigate_project_2", "investigate_project_3"]

    - id: "investigate_project_2"
      name: "Investigate Project 2"
      agent: "guru"
      depends_on: null
      approval_required: false
      actions:
        - "Load project 2 documentation"
        - "Search for relevant concepts"
        - "Extract findings and citations"
        - "Document project-specific insights"
      checkpoint:
        path: "project-2-findings.md"
        required_for_next_phase: true
      timeout_seconds: 300
      parallel_with: ["investigate_project_1", "investigate_project_3"]

    - id: "investigate_project_3"
      name: "Investigate Project 3"
      agent: "guru"
      depends_on: null
      approval_required: false
      actions:
        - "Load project 3 documentation"
        - "Search for relevant concepts"
        - "Extract findings and citations"
        - "Document project-specific insights"
      checkpoint:
        path: "project-3-findings.md"
        required_for_next_phase: true
      timeout_seconds: 300
      parallel_with: ["investigate_project_1", "investigate_project_2"]

    - id: "synthesize"
      name: "Synthesize Findings"
      agent: "project-manager"
      depends_on: "investigate_project_3"
      approval_required: false
      actions:
        - "Combine findings from all projects"
        - "Identify common patterns and differences"
        - "Resolve conflicts or inconsistencies"
        - "Generate comprehensive answer"
      checkpoint:
        path: "synthesized-findings.md"
        required_for_next_phase: false
      timeout_seconds: 300

# Success criteria
success_criteria:
  - "All projects investigated in parallel"
  - "Findings extracted and documented per project"
  - "Findings synthesized into coherent answer"
  - "Cross-project patterns identified"

# Performance
performance:
  estimated_duration_seconds: 300
  max_duration_seconds: 600

# Recovery
recovery:
  on_phase_failure: "retry_phase"
  checkpoint_frequency: "per_phase"
  resume_from: "last_checkpoint"
