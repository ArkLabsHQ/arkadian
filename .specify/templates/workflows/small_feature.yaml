# Metadata
name: "small_feature"
description: "Small feature additions (≤10 files, <500 lines)"
version: "1.0.0"
author: "arkadian-system"
created: "2025-10-25"
last_modified: "2025-10-25"

# Applicability
applies_to:
  primary_intent: "develop"
  sub_intent: ["small_feature"]
  complexity: ["simple", "medium"]
  urgency: ["low", "normal", "high"]
  multi_project: false

# Execution
execution:
  agents: ["ark-developer", "ark-tester"]
  phases:
    - id: "implement"
      name: "Implement Small Feature"
      agent: "developer"
      depends_on: null
      approval_required: true
      approval_message: "Feature plan ready. Proceed with implementation?"
      actions:
        - "Create branch: feat/<area>-<slug>"
        - "Implement feature (≤10 files, <500 lines)"
        - "Write unit tests"
        - "Run tests locally"
        - "Commit with conventional commit message"
      checkpoint:
        path: "git commit SHA"
        required_for_next_phase: true
      timeout_seconds: 900
      auto_retry: false

    - id: "test"
      name: "Validate Feature"
      agent: "tester"
      depends_on: "implement"
      approval_required: false
      actions:
        - "Run full test suite (unit + integration)"
        - "Validate feature behavior"
        - "Check code coverage"
        - "Verify no regressions"
      timeout_seconds: 600
      auto_retry: true
      max_retries: 2

# Success criteria
success_criteria:
  - "Feature implemented in ≤10 files"
  - "Code changes <500 lines"
  - "All tests pass"
  - "Code coverage maintained or improved"

# Performance
performance:
  estimated_duration_seconds: 900
  max_duration_seconds: 1800

# Recovery
recovery:
  on_phase_failure: "retry_phase"
  checkpoint_frequency: "per_phase"
  resume_from: "last_checkpoint"
