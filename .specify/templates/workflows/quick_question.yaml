# Metadata
name: "quick_question"
description: "Simple Q&A, no code changes, single agent responds with citations"
version: "1.0.0"
author: "arkadian-system"
created: "2025-10-25"
last_modified: "2025-10-25"

# Applicability
applies_to:
  primary_intent: "ask_question"
  complexity: ["simple"]
  urgency: ["low", "normal", "high", "critical"]
  multi_project: false

# Execution
execution:
  agents: ["ark-guru"]
  phases:
    - id: "answer"
      name: "Answer Question"
      agent: "guru"
      depends_on: null
      approval_required: false
      actions:
        - "Load relevant documentation from project INDEX.md"
        - "Search for concept in architecture and usage docs"
        - "Explain concept with citations to source files"
        - "Provide code examples if applicable"
      timeout_seconds: 300

# Success criteria
success_criteria:
  - "Question answered with relevant citations"
  - "Documentation sources referenced"
  - "No code changes made"

# Performance
performance:
  estimated_duration_seconds: 120
  max_duration_seconds: 300

# Recovery
recovery:
  on_phase_failure: "retry_phase"
  checkpoint_frequency: "per_phase"
  resume_from: "last_checkpoint"
